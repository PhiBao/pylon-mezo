<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img"
     aria-labelledby="redemption-queue-title redemption-queue-desc" font-family="Space Grotesk, Inter, system-ui, sans-serif">
  <title id="redemption-queue-title">Why health is not enough: the redemption queue</title>
  <desc id="redemption-queue-desc">A diagram of the SortedTroves queue on Mezo Testnet, running from the 110% MCR
    redemption tail to the safe head, with 245 live troves, one borrower marked at 148% ICR with its MUSD buffer, and
    the Pylon reserve shield that pushes a drifting trove back up the queue.</desc>

  <defs>
    <marker id="rq-arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#E11D48"/>
    </marker>
    <marker id="rq-arrow-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#10B981"/>
    </marker>
    <marker id="rq-arrow-down-red" markerWidth="8" markerHeight="7" refX="4" refY="6" orient="auto">
      <polygon points="0 0, 8 0, 4 7" fill="#E11D48"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" fill="#0A0B0D"/>

  <!-- ═══ title block ═══ -->
  <text x="40" y="42" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" letter-spacing="0.18em" fill="#6B7280">PYLON · MEZO TESTNET · CHAINID 31611</text>
  <text x="40" y="72" font-size="23" font-weight="600" fill="#E8EAED">Why health is not enough: the redemption queue</text>
  <text x="40" y="94" font-size="12" fill="#9AA1AC">SortedTroves on Mezo — redemptions walk up from the 110% MCR tail</text>

  <rect x="620" y="18" width="540" height="82" rx="4" fill="#101216" stroke="#1F232B" stroke-width="1"/>
  <text x="636" y="40" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" letter-spacing="0.14em" fill="#6B7280">WHAT THIS ANSWERS</text>
  <g font-size="11.5" fill="#9AA1AC">
    <text x="636" y="62">ICR tells you whether you get liquidated. Your rank in the sorted</text>
    <text x="636" y="80">queue tells you whether you get redeemed — a 148% trove can still</text>
    <text x="636" y="97" fill="#E8EAED">lose BTC, one redemption at a time.</text>
  </g>

  <!-- ═══ the queue ═══ -->
  <text x="110" y="122" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" letter-spacing="0.1em" fill="#9AA1AC">SORTEDTROVES · ONE LINE PER TROVE, ORDERED BY NOMINAL COLLATERAL RATIO</text>
  <text x="110" y="136" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#6B7280">245 troves live on Mezo Testnet · a redemption burns MUSD from the lowest ICR upward</text>
  <text x="1130" y="122" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" letter-spacing="0.1em" fill="#9AA1AC">SAFE HEAD</text>
  <text x="1130" y="136" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#6B7280">200%+ collateral ratio</text>
  <text x="1130" y="152" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#6B7280">a price drop slides every trove toward the tail</text>

  <!-- trove density: one hairline per trove -->
  <path fill="#101419" stroke="none" d="M 110,250 L 110,247.8 L 120,247.8 L 130,247.8 L 140,247.7 L 150,247.7 L 160,247.6 L 170,247.5 L 180,247.4 L 190,247.3 L 200,247.2 L 210,247.0 L 220,246.9 L 230,246.7 L 240,246.5 L 250,246.2 L 260,245.9 L 270,245.6 L 280,245.2 L 290,244.8 L 300,244.3 L 310,243.8 L 320,243.2 L 330,242.5 L 340,241.8 L 350,241.0 L 360,240.1 L 370,239.2 L 380,238.2 L 390,237.1 L 400,235.9 L 410,234.6 L 420,233.3 L 430,231.9 L 440,230.4 L 450,228.8 L 460,227.2 L 470,225.4 L 480,223.7 L 490,221.9 L 500,220.0 L 510,218.1 L 520,216.2 L 530,214.3 L 540,212.4 L 550,210.5 L 560,208.7 L 570,206.8 L 580,205.1 L 590,203.4 L 600,201.8 L 610,200.2 L 620,198.8 L 630,197.5 L 640,196.3 L 650,195.3 L 660,194.3 L 670,193.6 L 680,192.9 L 690,192.4 L 700,192.1 L 710,192.0 L 720,192.0 L 730,192.0 L 740,192.1 L 750,192.4 L 760,192.8 L 770,193.4 L 780,194.0 L 790,194.7 L 800,195.5 L 810,196.4 L 820,197.3 L 830,198.3 L 840,199.3 L 850,200.3 L 860,201.3 L 870,202.4 L 880,203.5 L 890,204.5 L 900,205.6 L 910,206.7 L 920,207.8 L 930,208.8 L 940,209.9 L 950,210.9 L 960,212.0 L 970,213.0 L 980,214.1 L 990,215.1 L 1000,216.2 L 1010,217.3 L 1020,218.3 L 1030,219.4 L 1040,220.5 L 1050,221.5 L 1060,222.6 L 1070,223.7 L 1080,224.8 L 1090,225.9 L 1100,227.0 L 1100,250 Z"/>
  <path fill="none" stroke="#2E3440" stroke-width="1" d="M 110,250 V 247.8 M 120,250 V 247.8 M 130,250 V 247.8 M 140,250 V 247.7 M 150,250 V 247.7 M 160,250 V 247.6 M 170,250 V 247.5 M 180,250 V 247.4 M 190,250 V 247.3 M 200,250 V 247.2 M 210,250 V 247.0 M 220,250 V 246.9 M 230,250 V 246.7 M 240,250 V 246.5 M 250,250 V 246.2 M 260,250 V 245.9 M 270,250 V 245.6 M 280,250 V 245.2 M 290,250 V 244.8 M 300,250 V 244.3 M 310,250 V 243.8 M 320,250 V 243.2 M 330,250 V 242.5 M 340,250 V 241.8 M 350,250 V 241.0 M 360,250 V 240.1 M 370,250 V 239.2 M 380,250 V 238.2 M 390,250 V 237.1 M 400,250 V 235.9 M 410,250 V 234.6 M 420,250 V 233.3 M 430,250 V 231.9 M 440,250 V 230.4 M 450,250 V 228.8 M 460,250 V 227.2 M 470,250 V 225.4 M 480,250 V 223.7 M 490,250 V 221.9 M 500,250 V 220.0 M 510,250 V 218.1 M 520,250 V 216.2 M 530,250 V 214.3 M 540,250 V 212.4 M 550,250 V 210.5 M 560,250 V 208.7 M 570,250 V 206.8 M 580,250 V 205.1 M 590,250 V 203.4 M 600,250 V 201.8 M 610,250 V 200.2 M 620,250 V 198.8 M 630,250 V 197.5 M 640,250 V 196.3 M 650,250 V 195.3 M 660,250 V 194.3 M 670,250 V 193.6 M 680,250 V 192.9 M 690,250 V 192.4 M 700,250 V 192.1 M 710,250 V 192.0 M 720,250 V 192.0 M 730,250 V 192.0 M 740,250 V 192.1 M 750,250 V 192.4 M 760,250 V 192.8 M 770,250 V 193.4 M 780,250 V 194.0 M 790,250 V 194.7 M 800,250 V 195.5 M 810,250 V 196.4 M 820,250 V 197.3 M 830,250 V 198.3 M 840,250 V 199.3 M 850,250 V 200.3 M 860,250 V 201.3 M 870,250 V 202.4 M 880,250 V 203.5 M 890,250 V 204.5 M 900,250 V 205.6 M 910,250 V 206.7 M 920,250 V 207.8 M 930,250 V 208.8 M 940,250 V 209.9 M 950,250 V 210.9 M 960,250 V 212.0 M 970,250 V 213.0 M 980,250 V 214.1 M 990,250 V 215.1 M 1000,250 V 216.2 M 1010,250 V 217.3 M 1020,250 V 218.3 M 1030,250 V 219.4 M 1040,250 V 220.5 M 1050,250 V 221.5 M 1060,250 V 222.6 M 1070,250 V 223.7 M 1080,250 V 224.8 M 1090,250 V 225.9 M 1100,250 V 227.0"/>
  <line x1="110" y1="250" x2="1130" y2="250" stroke="#2A3038" stroke-width="1"/>

  <!-- ICR scale -->
  <g stroke="#2A3038" stroke-width="1">
    <line x1="110" y1="250" x2="110" y2="256"/>
    <line x1="230" y1="250" x2="230" y2="256"/>
    <line x1="360" y1="250" x2="360" y2="256"/>
    <line x1="500" y1="250" x2="500" y2="256"/>
    <line x1="660" y1="250" x2="660" y2="256"/>
    <line x1="830" y1="250" x2="830" y2="256"/>
    <line x1="1010" y1="250" x2="1010" y2="256"/>
  </g>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="6.5" fill="#6B7280" text-anchor="middle">
    <text x="110" y="268">110%</text>
    <text x="230" y="268">120%</text>
    <text x="360" y="268">130%</text>
    <text x="500" y="268">140%</text>
    <text x="660" y="268">150%</text>
    <text x="830" y="268">160%</text>
    <text x="1010" y="268">180%</text>
  </g>

  <!-- the tail -->
  <text x="120" y="202" font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" letter-spacing="0.12em" fill="#E11D48">REDEMPTION TAIL</text>
  <text x="120" y="214" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#6B7280">redemptions start at the lowest ICR above 110%</text>
  <line x1="110" y1="222" x2="110" y2="243" stroke="#E11D48" stroke-width="1.2"/>
  <polygon points="106,243 114,243 110,249" fill="#E11D48"/>

  <!-- the shield: reserve defence moves the trove back up the queue -->
  <path d="M 430,176 V 144 Q 430,136 438,136 H 822 Q 830,136 830,144 V 187" fill="none" stroke="#10B981" stroke-width="1.3" marker-end="url(#rq-arrow-green)"/>
  <rect x="506" y="148" width="260" height="12" rx="2" fill="#0A0B0D"/>
  <text x="636" y="158" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#10B981">defend(): the reserve lends MUSD, debt falls, ICR rises</text>
  <line x1="830" y1="192" x2="830" y2="246" stroke="#10B981" stroke-width="1" stroke-dasharray="4,3" opacity="0.75"/>
  <polygon points="830,244 835,252 830,260 825,252" fill="#10B981"/>
  <text x="830" y="280" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#10B981">defended to the target ICR</text>

  <!-- this borrower -->
  <line x1="430" y1="176" x2="430" y2="250" stroke="#F7931A" stroke-width="1.5"/>
  <polygon points="430,243 435,250 430,257 425,250" fill="#F7931A"/>
  <rect x="268" y="148" width="156" height="12" rx="2" fill="#0A0B0D"/>
  <text x="418" y="158" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#E8EAED">THIS TROVE · ICR 135%</text>

  <!-- redemptions walk the queue: everything in front of you is your buffer -->
  <line x1="110" y1="296" x2="430" y2="296" stroke="#E11D48" stroke-width="1.3" marker-end="url(#rq-arrow-red)"/>
  <g stroke="#E11D48" stroke-width="1.3">
    <line x1="160" y1="290" x2="160" y2="302" opacity="0.9"/>
    <line x1="220" y1="290" x2="220" y2="302" opacity="0.75"/>
    <line x1="280" y1="290" x2="280" y2="302" opacity="0.6"/>
    <line x1="340" y1="290" x2="340" y2="302" opacity="0.45"/>
    <line x1="400" y1="290" x2="400" y2="302" opacity="0.3"/>
  </g>
  <rect x="120" y="304" width="216" height="12" rx="2" fill="#0A0B0D"/>
  <text x="228" y="314" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#9AA1AC">your buffer: total debt of every trove in front</text>
  <rect x="102" y="318" width="252" height="12" rx="2" fill="#0A0B0D"/>
  <text x="228" y="328" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#E11D48">a redemption under that size never reaches you</text>
  <text x="1130" y="300" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#6B7280">one hairline ~ 2 troves · shape illustrative</text>

  <!-- ═══ the two ways a trove loses collateral, and the shield ═══ -->
  <g>
    <rect x="40" y="336" width="360" height="116" rx="4" fill="#101216" stroke="#1F232B" stroke-width="1"/>
    <rect x="40" y="336" width="2" height="116" fill="#6B7280"/>
    <text x="58" y="362" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" letter-spacing="0.14em" fill="#6B7280">LIQUIDATION</text>
    <text x="58" y="382" font-size="13" font-weight="600" fill="#E8EAED">ICR &lt; 110% MCR</text>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#9AA1AC">
      <text x="58" y="402">every trove under the line, all at once</text>
      <text x="58" y="414">a liquidator repays the debt and takes</text>
      <text x="58" y="426">the collateral at a penalty</text>
      <text x="58" y="438">you can see it coming: the price moved</text>
    </g>
  </g>
  <g>
    <rect x="420" y="336" width="360" height="116" rx="4" fill="#101216" stroke="#1F232B" stroke-width="1"/>
    <rect x="420" y="336" width="2" height="116" fill="#E11D48"/>
    <text x="438" y="362" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" letter-spacing="0.14em" fill="#E11D48">REDEMPTION · THE TAIL</text>
    <text x="438" y="382" font-size="13" font-weight="600" fill="#E8EAED">lowest ICR above 110%</text>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#9AA1AC">
      <text x="438" y="402">the trove closest to the line, one at a time</text>
      <text x="438" y="414">someone burns MUSD and takes your BTC</text>
      <text x="438" y="426">at the oracle price — your debt falls too</text>
      <text x="438" y="438">no warning shot: the price never moved</text>
    </g>
  </g>
  <g>
    <rect x="800" y="336" width="360" height="116" rx="4" fill="#101216" stroke="#1F232B" stroke-width="1"/>
    <rect x="800" y="336" width="2" height="116" fill="#10B981"/>
    <text x="818" y="362" font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" letter-spacing="0.14em" fill="#10B981">THE SHIELD · PYLON RESERVE</text>
    <text x="818" y="382" font-size="13" font-weight="600" fill="#E8EAED">defend() before the drift</text>
    <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="7.5" fill="#9AA1AC">
      <text x="818" y="402">anyone can call it — it is permissionless</text>
      <text x="818" y="414">the reserve lends MUSD to your position</text>
      <text x="818" y="426">the position repays its own trove debt</text>
      <text x="818" y="438">collateral is locked until the loan is repaid</text>
    </g>
  </g>

  <!-- ═══ legend ═══ -->
  <line x1="40" y1="464" x2="1160" y2="464" stroke="#1F232B" stroke-width="0.8"/>
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="8" fill="#9AA1AC">
    <line x1="40" y1="478" x2="40" y2="466" stroke="#2A3038" stroke-width="1.5"/>
    <text x="50" y="481">one trove · 245 live</text>
    <line x1="320" y1="478" x2="348" y2="478" stroke="#F7931A" stroke-width="1.5"/>
    <polygon points="340,474 345,478 340,482 335,478" fill="#F7931A"/>
    <text x="358" y="481">this trove, and where it sits</text>
    <line x1="640" y1="478" x2="668" y2="478" stroke="#E11D48" stroke-width="1.3"/>
    <polygon points="668,475 676,478 668,481" fill="#E11D48"/>
    <text x="686" y="481">redemption walk · your MUSD buffer</text>
    <line x1="940" y1="478" x2="964" y2="478" stroke="#10B981" stroke-width="1.3" stroke-dasharray="4,3"/>
    <text x="974" y="481">shield defence (defend())</text>
  </g>

  <!-- ═══ footnote ═══ -->
  <g font-family="JetBrains Mono, ui-monospace, monospace" font-size="7" fill="#6B7280">
    <text x="40" y="502">Mezo Testnet · chainId 31611 · SortedTroves 0x722E4D24FD6Ff8b0AC679450F3D91294607268fA · TroveManager 0xE47c80e8c23f6B4A1aE41c34837a0599D5D16bb0 · HintHelpers 0x4e4cBA3779d56386ED43631b4dCD6d8EacEcBCF6</text>
    <text x="40" y="512">MUSD 0x118917a40FAF1CD7a13dB0Ef56C86De7973Ac503 · PriceFeed 0x86bCF0841622a5dAC14A313a15f96A95421b9366 · PylonReserve 0x53a0206A307E084AdA2eB24346463cf4E14C5131 · PylonPosition 0x0e64B682Add80A61d24E61ed360b3F3679C6860a</text>
  </g>
</svg>
