[profile.default]
src = "src"
out = "out"
libs = ["lib"]
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
solc = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read-write", path = "./deployments/" }]

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo_mainnet = "https://rpc.mezo.org"

[fmt]
line_length = 100
tab_width = 4
